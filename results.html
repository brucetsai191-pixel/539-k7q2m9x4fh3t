          el("div", { class: "rec" }, "紀錄 " + m.record),
          el("div", { class: "stat" },
            el("span", {}, "近" + DATA.recent + "期 " + rate(m.hits, m.of)),
            ...(m.of_long > m.of ? [el("span", { class: "long" }, "近" + DATA.long + "期 " + rate(m.hits_long, m.of_long))] : []),
            ...(m.luck ? [el("span", { class: "luck" }, "贏" + m.luck[0] + "／輸" + m.luck[1])] : []),
            ...(m.ticks && m.ticks[0] ? [el("span", { class: "acc hi" }, "高中" + m.ticks[1] + "／" + m.ticks[0])] : []),
            ...(m.ticks && m.ticks[2] ? [el("span", { class: "acc lo" }, "低沒開" + m.ticks[3] + "／" + m.ticks[2])] : [])))));
    }
  }
}
function sendText() {   // luck.parse_preset
  const lines = ["#預勾 " + DATA.issue];
  for (const s of DATA.sources) for (const [word, which] of [["高", C.high], ["低", C.low], ["遮", MASK]])
    lines.push(s.name + word + "：" + s.members.filter(m => marks[keyOf(s.name, m.member)] === which)
      .map(m => m.member).join("、"));
  return lines.join("\n");
}
document.getElementById("send").addEventListener("click", () => { location.href = C.send + encodeURIComponent(sendText()); });
document.getElementById("only").addEventListener("change", render);
document.getElementById("hitonly").addEventListener("change", render);
render();
</script>
