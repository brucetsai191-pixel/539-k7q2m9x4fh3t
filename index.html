  const prev = new Set(DATA.previous ? DATA.previous.numbers : []);
  if (DATA.previous) document.getElementById("legend").textContent =
    "格內：紅底小數字＝勾高人數　藍底小數字＝勾低人數　後面為總報號人數　格子紅＝勾高　藍＝勾低　紫＝高低都有（2人以上深色）　劃線＝無人報號　粗框＝前一期 " + DATA.previous.issue
    + " 開出號碼　✕＝刪除　藍框「選」＝我的號碼";

  // 勾低會員報的號碼＝要刪除的號碼；勾高會員的號碼是選「我的號碼」的參考 (luck.py)
  const deleted = new Set(), highNums = new Set(), whoHigh = {}, whoLow = {};
  for (const s of DATA.sources) for (const m of s.members) {
    const mark = marks[keyOf(s.name, m.member)];
    if (m.void || !mark) continue;
    for (const n of m.numbers) {
      if (mark === C.high) { highNums.add(n); (whoHigh[n] = whoHigh[n] || []).push(m.member); }
      else { deleted.add(n); (whoLow[n] = whoLow[n] || []).push(m.member); }
    }
  }
  bet = bet.filter(n => n >= 1 && n <= 39);
  const elim = document.getElementById("elim");
  elim.hidden = false;
  const kept = [...highNums].filter(n => !deleted.has(n)).sort((a, b) => a - b);
  elim.replaceChildren(
    el("div", {}, "刪除（勾低的人報的號碼）：" + deleted.size + " 個，剩 " + (39 - deleted.size) + " 個"),
    el("div", {}, "勾高的人報的號碼扣掉刪除後：" + (highNums.size ? (kept.length ? kept.map(pad).join(" ") : "全部被刪")
      + "（原 " + highNums.size + " 個，刪 " + (highNums.size - kept.length) + " 個）" : "尚未勾高")),
    el("div", { class: "betline" }, "我的號碼（點格子選，最多 5 碼）：" + (bet.length ? bet.map(pad).join(" ") : "未選")
      + "（" + bet.length + "／5）" + (bet.length ? "　分區 " + zoneRatio(bet)
        + (bet.length === 5 && DATA.zones && DATA.zones.window
          ? "（近" + DATA.zones.window + "期出現 " + (DATA.zones.counts[zoneRatio(bet)] || 0) + " 次）" : "") : "")),
    ...(bet.length === 5 && DATA.zones && DATA.zones.window && !DATA.zones.counts[zoneRatio(bet)]
      ? [el("div", { class: "warn" }, "⚠ 分區 " + zoneRatio(bet) + " 近" + DATA.zones.window + "期沒有開出過")] : []),
    ...bet.filter(n => deleted.has(n) || (highNums.size && !highNums.has(n))).map(n => el("div", { class: "warn" },
      "⚠ " + pad(n) + (deleted.has(n)
        ? " 高低重疊（高：" + (whoHigh[n] || ["無"]).join("、") + "／低：" + whoLow[n].join("、") + "）"
        : " 勾高的人沒報（只記在我的號碼戰績）"))));
  renderZones();
  const counts = {}, ticked = {};
  for (const s of DATA.sources) for (const m of s.members) {
    if (m.void) continue;
    const mark = marks[keyOf(s.name, m.member)];
    for (const n of m.numbers) {
      counts[n] = (counts[n] || 0) + 1;
      if (mark) (ticked[n] = ticked[n] || []).push(mark);
    }
  }
  const tint = {};   // number -> grid colors of a ticked number; a ticked member's numbers use the same
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (let n = 1; n <= 39; n++) {
    const t = ticked[n] || [], kinds = new Set(t);
    const kind = kinds.size === 2 ? "both" : [...kinds][0];
    let bg = counts[n] ? C.reported : C.empty, fg = counts[n] ? "#222" : "#bbb";
    if (kind) {
      const pair = C.cell[kind]; bg = t.length >= 2 ? pair[1] : pair[0]; fg = t.length >= 2 ? "#fff" : "#222";
      tint[n] = `background:${bg};color:${fg}`;
    }
    grid.append(el("div", { class: "cell" + (prev.has(n) ? " prev" : "") + (deleted.has(n) ? " del" : "")
        + (bet.includes(n) ? " bet" : "") + " z" + zoneOf(n), style: `background-color:${bg};color:${fg}`, onclick: () => toggleBet(n) },
      el("b", counts[n] ? {} : { class: "none", style: prev.has(n) ? "color:#222" : "" }, pad(n)), countLine(n, t, counts[n])));
  }

  const only = document.getElementById("only").checked;
  const lists = document.getElementById("lists");
  lists.replaceChildren();
  for (const s of DATA.sources) {
    lists.append(el("h2", {}, s.name + "（" + s.members.length + " 人）"));
    if (s.name === "Facebook" && !s.collected) { lists.append(el("div", { class: "empty" }, "本期未收集")); continue; }
    if (!s.members.length) { lists.append(el("div", { class: "empty" }, "目前無會員報號")); continue; }
    for (const m of s.members) {
      const k = keyOf(s.name, m.member), mark = marks[k];
      if (only && !mark) continue;
      const tick = which => el("button", { class: "tick " + which + (mark === which ? " on" : ""),
        onclick: () => { if (marks[k] === which) delete marks[k]; else marks[k] = which; saveMarks(); render(); } },
        which === C.high ? "高" : "低");
      lists.append(el("div", { class: "row" },
        el("div", { class: "ticks" }, tick(C.high), tick(C.low)),
        el("div", { class: "who" },
          el("div", { class: "name", style: mark ? `color:${C.id[mark]}` : "" }, m.member,
            ...(m.delete ? [el("span", { class: "deltag" }, "建議低")] : [])),
          m.void ? el("div", { class: "nums void" }, "作廢（" + m.void + "）") :
            el("div", { class: "nums" }, ...m.numbers.map(n => el("span", {
              class: "num" + (deleted.has(n) && mark !== C.low ? " cut" : "") + (bet.includes(n) ? " mine" : ""),
              style: mark ? tint[n] : "" }, pad(n)))),
          el("div", { class: "rec" }, "紀錄 " + m.record)),
        el("div", { class: "stat" }, "近" + DATA.recent + "期", el("br"), m.hits + "／" + m.of)));
    }
  }
}
const ZONES = DATA.zones ? DATA.zones.zones : [[1, 13], [14, 26], [27, 39]];
const zoneOf = n => ZONES.findIndex(([lo, hi]) => n >= lo && n <= hi) + 1;
function zoneRatio(numbers) {
  const r = [0, 0, 0];
  for (const n of numbers) r[zoneOf(n) - 1]++;
  return r.join(":");
}
function renderZones() {   // 三分區 (line_message.zone_summary)
  const box = document.getElementById("zones"), z = DATA.zones;
  if (!z || !z.window) { box.hidden = true; return; }
  box.hidden = false;
  box.replaceChildren(
    el("div", {}, "三分區　", el("b", { class: "z1" }, "01–13"), "／", el("b", { class: "z2" }, "14–26"), "／",
      el("b", { class: "z3" }, "27–39"), "（格子上緣顏色）"),
    el("div", { class: "ratios" }, "近" + z.recent.length + "期（舊→新）：" + z.recent.map(([, r]) => r.join(":")).join("　")),
    el("div", {}, "近" + z.window + "期最常見：" + z.top.map(([k, c]) => k + " ×" + c).join("、")));
}
function countLine(n, t, total) {   // 勾高人數（紅）、勾低人數（藍）、總人數
  const high = t.filter(m => m === C.high).length, low = t.length - high;
  return el("span", { class: "cnt" }, ...(high ? [el("i", { class: "ch" }, String(high))] : []),
    ...(low ? [el("i", { class: "cl" }, String(low))] : []), total ? total + "人" : "－");
}
function toggleBet(n) {
  if (bet.includes(n)) bet = bet.filter(x => x !== n);
  else if (bet.length >= 5) { alert("我的號碼最多 5 碼，請先點掉一個"); return; }
  else bet = [...bet, n].sort((a, b) => a - b);
  saveBet(); render();
}
function sendText() {   // luck.phone_message: one full snapshot of this issue's ticks and my numbers
  const lines = ["#勾選 " + DATA.issue];
  for (const s of DATA.sources) for (const [word, which] of [["高", C.high], ["低", C.low]])
    lines.push(s.name + word + "：" + s.members.filter(m => marks[keyOf(s.name, m.member)] === which).map(m => m.member).join("、"));
  lines.push("我的號碼：" + bet.map(pad).join(" "));
  return lines.join("\n");
}
document.getElementById("send").addEventListener("click", () => {
  if (!bet.length && !confirm("還沒選我的號碼：這期送出後不會記跟對／運氣。仍要送出？")) return;
  location.href = C.send + encodeURIComponent(sendText());
});
document.getElementById("only").addEventListener("change", render);
document.getElementById("clear").addEventListener("click", () => {
  if (confirm("清除這支手機上的全部勾選？")) { marks = {}; saveMarks(); render(); }
});
render();
</script>
