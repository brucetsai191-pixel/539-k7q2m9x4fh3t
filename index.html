<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>539 勾選</title>
<style>
  :root { --bg:#ffffff; --fg:#222; --muted:#777; --line:#e3e3e3; --soft:#f6f6f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:14px 16px 40px; }
  h1 { font-size:19px; margin:0; }
  .sub, .note { color:var(--muted); font-size:13px; }
  .ref { margin:8px 0 10px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cell { border:1px solid var(--line); border-radius:6px; text-align:center; padding:4px 0 3px; }
  .cell b { display:block; font-size:16px; }
  .cell span { font-size:11px; }
  .legend { font-size:12px; color:var(--muted); margin:6px 0 4px; }
  h2 { font-size:16px; margin:20px 0 6px; padding-top:12px; border-top:1px solid var(--line); }
  .picked div { margin:3px 0; }
  .num { font-weight:700; margin-right:6px; }
  .tag { color:var(--muted); font-size:11px; margin-right:6px; }
  .bar { display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button.act { border:1px solid var(--line); background:var(--soft); border-radius:8px; padding:7px 12px; font-size:14px; color:var(--fg); }
  label.only { font-size:14px; display:flex; align-items:center; gap:6px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--soft); }
  .ticks { display:flex; gap:4px; flex:none; }
  .tick { width:38px; height:34px; border-radius:8px; border:1px solid #cfcfcf; background:#fff; font-size:14px; color:#555; }
  .tick.on.high { background:#a31515; border-color:#a31515; color:#fff; }
  .tick.on.low { background:#3f5670; border-color:#3f5670; color:#fff; }
  .who { flex:1; min-width:0; }
  .who .name { font-weight:600; word-break:break-all; }
  .who .nums { font-size:13px; color:#444; }
  .stat { flex:none; text-align:right; font-size:12px; color:var(--muted); }
  .void { color:#b26a00; }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="ref" id="ref"></div>
  <div class="grid" id="grid"></div>
  <div class="legend">格內為報號人數　紅＝勾高　藍＝勾低　紫＝高低都有（2人以上深色）</div>
  <h2>勾選會員報號</h2>
  <div class="picked" id="picked"></div>
  <div class="bar">
    <label class="only"><input type="checkbox" id="only"> 只看已勾選</label>
    <button class="act" id="clear">清除全部勾選</button>
  </div>
  <div id="lists"></div>
  <p class="note">勾選只存在這支手機，不會傳回電腦。近10期：報中期數／統計期數；近3期：1 中、0 未中、x 未報、廢 作廢、- 未收集。</p>
</main>
<script>
const DATA = {"issue": "115000265", "draw_date": "2026-11-02", "reference": "無成立號碼", "lottohall_final": false, "facebook_status": "Facebook：本期未收集", "recent": 10, "sources": [{"name": "樂透堂", "members": [{"member": "PUJICO", "numbers": [15, 26, 28], "void": null, "hits": 8, "of": 10, "record": "1 1 0", "app_mark": null}, {"member": "qwer0227", "numbers": [2, 12, 27], "void": null, "hits": 1, "of": 10, "record": "x x 1", "app_mark": "high"}, {"member": "qwqw5151", "numbers": [36, 37, 38], "void": null, "hits": 5, "of": 10, "record": "1 1 1", "app_mark": null}, {"member": "一道彩虹", "numbers": [9, 14, 31], "void": null, "hits": 3, "of": 10, "record": "0 0 0", "app_mark": null}, {"member": "四兩搏千金", "numbers": [2, 9, 35], "void": null, "hits": 4, "of": 10, "record": "0 1 1", "app_mark": null}, {"member": "毒毒毒", "numbers": [12, 15, 28], "void": null, "hits": 3, "of": 10, "record": "1 0 1", "app_mark": null}, {"member": "漂泊1201", "numbers": [6, 26, 28], "void": null, "hits": 3, "of": 10, "record": "1 1 0", "app_mark": null}, {"member": "蝦仁穿越", "numbers": [23, 26, 32], "void": null, "hits": 2, "of": 10, "record": "0 1 0", "app_mark": null}]}, {"name": "Facebook", "collected": false, "members": []}]};
const C = {"id": {"high": "#a31515", "low": "#3f5670"}, "cell": {"high": ["#f6d5d5", "#a31515"], "low": ["#d9e2ec", "#3f5670"], "both": ["#e8d8f0", "#8e24aa"]}, "high": "high", "low": "low", "reported": "#eeeeee", "empty": "#ffffff"};
const KEY = "539marks";
const pad = n => String(n).padStart(2, "0");
const keyOf = (source, member) => source + "|" + member;

function loadMarks() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw) || {};
  } catch (e) {}
  const start = {};   // nothing saved on this phone yet: begin from the App's ticks
  for (const s of DATA.sources) for (const m of s.members) if (m.app_mark) start[keyOf(s.name, m.member)] = m.app_mark;
  return start;
}
let marks = loadMarks();
function saveMarks() { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} }

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") node.style.cssText = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids) node.append(kid);
  return node;
}

function render() {
  const fb = DATA.sources.find(s => s.name === "Facebook");
  document.getElementById("title").textContent = "539 下一期 " + DATA.issue;
  document.getElementById("sub").textContent = "開獎日 " + DATA.draw_date + "　樂透堂" + (DATA.lottohall_final ? "" : "（暫定）")
    + "　" + DATA.facebook_status;
  document.getElementById("ref").textContent = "下一期參考號碼：" + DATA.reference;

  const counts = {}, ticked = {};
  for (const s of DATA.sources) for (const m of s.members) {
    if (m.void) continue;
    const mark = marks[keyOf(s.name, m.member)];
    for (const n of m.numbers) {
      counts[n] = (counts[n] || 0) + 1;
      if (mark) (ticked[n] = ticked[n] || []).push({ member: m.member, source: s.name, mark });
    }
  }
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (let n = 1; n <= 39; n++) {
    const t = ticked[n] || [], kinds = new Set(t.map(x => x.mark));
    const kind = kinds.size === 2 ? "both" : [...kinds][0];
    let bg = counts[n] ? C.reported : C.empty, fg = counts[n] ? "#222" : "#bbb";
    if (kind) { const pair = C.cell[kind]; bg = t.length >= 2 ? pair[1] : pair[0]; fg = t.length >= 2 ? "#fff" : "#222"; }
    grid.append(el("div", { class: "cell", style: `background:${bg};color:${fg}` },
      el("b", {}, pad(n)), el("span", {}, counts[n] ? counts[n] + "人" : "－")));
  }

  const picked = document.getElementById("picked");
  picked.replaceChildren();
  const numbers = Object.keys(ticked).map(Number).sort((a, b) => a - b);
  if (!numbers.length) picked.append(el("div", { class: "empty" }, "還沒有勾選的會員報號"));
  for (const n of numbers) {
    const line = el("div", {}, el("span", { class: "num" }, pad(n)));
    for (const t of ticked[n]) {
      line.append(el("span", { style: `color:${C.id[t.mark]};font-weight:700` }, t.member),
                  el("span", { class: "tag" }, "(" + (t.source === "Facebook" ? "FB" : "樂") + ")"));
    }
    picked.append(line);
  }

  const only = document.getElementById("only").checked;
  const lists = document.getElementById("lists");
  lists.replaceChildren();
  for (const s of DATA.sources) {
    lists.append(el("h2", {}, s.name + "（" + s.members.length + " 人）"));
    if (s.name === "Facebook" && !s.collected) { lists.append(el("div", { class: "empty" }, "本期未收集")); continue; }
    if (!s.members.length) { lists.append(el("div", { class: "empty" }, "目前無會員報號")); continue; }
    for (const m of s.members) {
      const k = keyOf(s.name, m.member), mark = marks[k];
      if (only && !mark) continue;
      const tick = which => el("button", { class: "tick " + which + (mark === which ? " on" : ""),
        onclick: () => { if (marks[k] === which) delete marks[k]; else marks[k] = which; saveMarks(); render(); } },
        which === C.high ? "高" : "低");
      lists.append(el("div", { class: "row" },
        el("div", { class: "ticks" }, tick(C.high), tick(C.low)),
        el("div", { class: "who" },
          el("div", { class: "name", style: mark ? `color:${C.id[mark]}` : "" }, m.member),
          m.void ? el("div", { class: "nums void" }, "作廢（" + m.void + "）") : el("div", { class: "nums" }, m.numbers.map(pad).join(" "))),
        el("div", { class: "stat" }, "近" + DATA.recent + "期 " + m.hits + "／" + m.of, el("br"), "近3期 " + m.record)));
    }
  }
}
document.getElementById("only").addEventListener("change", render);
document.getElementById("clear").addEventListener("click", () => {
  if (confirm("清除這支手機上的全部勾選？")) { marks = {}; saveMarks(); render(); }
});
render();
</script>
</body>
</html>
